services:
  db:
    image: postgres:15-alpine
    container_name: sigra_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sigra_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:?defina SESSION_SECRET}
      # Envio do código de MFA por e-mail (admin e técnico)
      - SMTP_HOST=${SMTP_HOST:?defina SMTP_HOST para o envio do código de MFA}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-SIGRA UEPA <nao-responda@uepa.br>}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:?defina CORS_ORIGINS com as origens https do front}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - PUBLIC_REGISTRATION_ENABLED=${PUBLIC_REGISTRATION_ENABLED:-true}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?defina VITE_API_URL (https) para o build}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_CADASTRO_PUBLICO: ${VITE_CADASTRO_PUBLICO:-true}
    container_name: sigra_frontend
    restart: unless-stopped
    environment:
      - API_ORIGIN=${VITE_API_URL}
      - CSP_HEADER_NAME=${CSP_HEADER_NAME:-Content-Security-Policy-Report-Only}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  pg_data_prod:
